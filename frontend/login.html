<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | AI Research Agent</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand" style="margin-bottom: 1rem;">
      <div class="brand-mark">RA</div>
      <span>AI Research Agent</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue your research conversations.</p>

    <div id="auth-alert" class="alert alert-error" hidden></div>

    <form id="login-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width: 100%;">Log in</button>
    </form>

    <p class="auth-footer">No account yet? <a href="/signup">Sign up</a></p>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
